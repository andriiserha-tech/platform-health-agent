[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "platform-health-agent"
version = "0.1.0"
description = "Health monitoring for Azure Data Factory and Databricks with Teams alerts and safe auto-remediation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.15,<2",
    "azure-mgmt-datafactory>=7,<10",
    "databricks-sdk>=0.30,<1",
    "pydantic-settings>=2.2,<3",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-requests",
]

[project.scripts]
health-agent = "health_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/health_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "DTZ"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"notebooks/**" = ["F821", "E501", "E402"]  # dbutils/spark/display are notebook globals

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["health_agent"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["azure.*", "databricks.*", "IPython", "IPython.*", "pyspark.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=health_agent --cov-report=term-missing"
